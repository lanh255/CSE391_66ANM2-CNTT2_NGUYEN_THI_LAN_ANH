<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Biến Động Số Lượng Cá Thể Theo Chu Kì</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&amp;family=Lora:ital,wght@1,400&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .slide-container {
            width: 1280px;
            height: 720px;
            position: relative;
            overflow: hidden;
            background-color: #2E7D32;
            color: white;
            display: flex;
            flex-direction: column;
        }
        .background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("https://page.gensparksite.com/slides_images/9e6945bebd0f59c75927ddca2726ebe4.webp");
            background-size: cover;
            background-position: center;
            filter: brightness(0.7);
            z-index: 1;
        }
        /* Fallback for background image if URL breaks */
        .background-fallback {
            background-color: #1b4d2e;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(46, 125, 50, 0.6); /* Green overlay */
            z-index: 2;
        }
        .content-wrapper {
            position: relative;
            z-index: 3;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }
        .title {
            font-size: 64px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 24px;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            color: #FFFFFF;
        }
        .subtitle {
            font-family: 'Lora', serif;
            font-size: 32px;
            font-style: italic;
            color: #FFF9C4; /* Light yellow */
            margin-bottom: 48px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        .decoration-line {
            width: 150px;
            height: 6px;
            background-color: #FFF9C4;
            margin-bottom: 30px;
            border-radius: 3px;
        }
        .icon-container {
            font-size: 80px;
            color: #FFF9C4;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        .footer-info {
            position: absolute;
            bottom: 30px;
            right: 40px;
            font-size: 18px;
            color: rgba(255, 255, 255, 0.8);
            z-index: 3;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .badge {
            background-color: #FFF9C4;
            color: #2E7D32;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 16px;
            display: inline-block;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
<div class="slide-container background-fallback">
<div class="background-image"></div>
<div class="overlay"></div>
<div class="content-wrapper">
<div class="icon-container">
<i class="fas fa-leaf"></i>
</div>
<div class="decoration-line"></div>
<h1 class="title">
                BIẾN ĐỘNG SỐ LƯỢNG<br/>CÁ THỂ THEO CHU KÌ
            </h1>
<p class="subtitle">
                Sinh học 12 – Chương Quần Thể Sinh Vật
            </p>
<div class="badge">
<i class="fas fa-microscope mr-2"></i> Bài Giảng Sinh Học
            </div>
</div>
<div class="footer-info">
<p><i class="fas fa-book-open mr-2"></i> Giáo Trình Chuẩn</p>
</div>
</div>
</body>
</html>
